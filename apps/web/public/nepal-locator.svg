<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" width="180" height="140" role="img" aria-hidden="true" focusable="false">
  <!--
    A schematic locator, not a coverage map. The outline is a simplified silhouette of
    Nepal's east-west span; the six tinted marks sit roughly over the districts that
    could be matched to at least one response statement (Rasuwa, Nuwakot, Dhading,
    Gorkha, Chitwan, Kavrepalanchok, all clustered north and east of Kathmandu). It
    carries no interaction and no text: components/board/locator.tsx renders the same
    geometry inline with theme tokens; this file is the static, standalone copy.
  -->
  <path
    d="M8 78 C 6 62, 22 50, 34 46 C 40 38, 36 26, 48 22 C 60 18, 66 28, 78 24
       C 90 20, 96 10, 112 12 C 128 14, 130 26, 144 30 C 160 34, 172 44, 172 58
       C 172 70, 160 72, 156 82 C 152 94, 158 104, 148 112 C 136 122, 118 116, 106 122
       C 92 128, 84 120, 70 122 C 54 124, 44 116, 32 110 C 18 104, 10 94, 8 78 Z"
    fill="#E2E1DC"
    stroke="none"
  />
  <g fill="#EDF1F5" stroke="#2E4A62" stroke-width="1.25">
    <rect x="66" y="40" width="10" height="9" rx="1" />
    <rect x="78" y="36" width="10" height="9" rx="1" />
    <rect x="90" y="42" width="10" height="9" rx="1" />
    <rect x="80" y="50" width="10" height="9" rx="1" />
    <rect x="100" y="52" width="10" height="9" rx="1" />
    <rect x="94" y="62" width="10" height="9" rx="1" />
